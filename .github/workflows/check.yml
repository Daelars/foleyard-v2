name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Every step resolves to the locally installed binaries through the
      # package.json scripts. npx tsc resolves to an unrelated tsc@2.0.4
      # package on CI runners instead of the TypeScript compiler.
      - run: bun run typecheck
      - run: bun run lint
      # Publishes the failure before the test suite: a newly disclosed high or
      # critical advisory in a shipped dependency blocks the pull request, while
      # development-only and unreachable findings stay out of the way (#260).
      - run: node scripts/check-dependency-audit.cjs
      - run: bun run test
      - run: bun run test:coverage
      - run: bun run build
      - run: node scripts/check-expected-failures.cjs
      - run: node scripts/check-v2-boundaries.cjs
      - run: bun run docs:prepare
      - run: bun run docs:check
      - run: bun run example:v2-minimal
      - run: bun run example:v2-settings
      - run: node examples/core/query-library/run.ts
