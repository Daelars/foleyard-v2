name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Data-loss expected failures are release blockers (#304): refuse to
      # package while any `data-loss` entry is pinned.
      - run: node scripts/check-expected-failures.cjs --release
      # release:build runs `next build`, writes build provenance, stages and
      # checks docs, then packages — so the shipped manifest carries the build
      # id of the binary it ships with (#241).
      - run: bun run release:build
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      - name: Verify release files
        shell: pwsh
        run: |
          Get-ChildItem dist-electron
          $manifestPath = "staged-docs/foleyard-docs/manifest.json"
          if (!(Test-Path $manifestPath)) {
            throw "staged docs manifest missing at $manifestPath"
          }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($manifest.buildId)) {
            throw "staged docs manifest has no build id; the production build did not run first"
          }
          $productVersion = (Get-Content "package.json" -Raw | ConvertFrom-Json).version
          if ($manifest.productVersion -ne $productVersion) {
            throw "staged docs productVersion $($manifest.productVersion) does not match package.json $productVersion"
          }
          if (!(Test-Path "dist-electron/latest.yml")) {
            throw "dist-electron/latest.yml was not generated"
          }
          $latest = Get-Content "dist-electron/latest.yml" -Raw
          $pathMatch = [regex]::Match($latest, "(?m)^path:\s*(.+)\s*$")
          if (!$pathMatch.Success) {
            throw "dist-electron/latest.yml does not contain an installer path"
          }
          $installerName = $pathMatch.Groups[1].Value.Trim()
          if (!(Test-Path (Join-Path "dist-electron" $installerName))) {
            throw "latest.yml points to $installerName, but that file was not generated"
          }
          if (!(Test-Path (Join-Path "dist-electron" "$installerName.blockmap"))) {
            throw "latest.yml points to $installerName, but $installerName.blockmap was not generated"
          }
          if (!(Get-ChildItem "dist-electron/Foleyard-Setup-*.exe")) {
            throw "No Windows installer was generated"
          }
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist-electron/Foleyard-Setup-*.exe
            dist-electron/Foleyard-Setup-*.exe.blockmap
            dist-electron/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
