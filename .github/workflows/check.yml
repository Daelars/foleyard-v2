name: Check
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Every step resolves to the locally installed binaries through the
      # package.json scripts. npx tsc resolves to an unrelated tsc@2.0.4
      # package on CI runners instead of the TypeScript compiler.
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run test:coverage
      - run: bun run build
