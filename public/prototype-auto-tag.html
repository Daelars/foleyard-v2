<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PROTOTYPE (throwaway) — auto-tag v2: Coverage Board</title>
<!--
  PROTOTYPE, throwaway. One screen. The coverage board is the extension's face.
  auto-tag runs behind it: when new files land, each filename is checked against
  the rule list and matching tags are written. The board counts move.
-->
<style>
  :root{--canvas:#0b0b10;--shell:#101014;--accent:#f0503c;--accent-hi:#ff5a44;--accent-tx:#ff7a66;--line:rgba(255,255,255,.1);--tx:#f4f4f5;--mut:#a1a1aa;--dim:#636366;--ok:#4ade80;--yel:#fbbf24}
  *{box-sizing:border-box}html,body{height:100%}
  body{margin:0;background:var(--canvas);color:var(--tx);font-family:"DM Sans",-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  .glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at top left,rgba(240,80,60,.13),transparent 38%),radial-gradient(circle at bottom right,rgba(240,80,60,.06),transparent 40%)}
  .app{display:flex;height:100vh;position:relative}
  .rail{width:60px;background:var(--shell);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:6px}
  .rail button{width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:var(--mut);font-size:17px;cursor:pointer}
  .rail button.on{background:rgba(240,80,60,.14);border:1px solid rgba(240,80,60,.5);color:var(--tx);box-shadow:0 0 18px rgba(240,80,60,.25)}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .search{margin:16px 20px 0;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:12px;padding:10px 14px}
  .search input{flex:1;background:transparent;border:0;color:var(--tx);font-size:15px;outline:none}
  .head{padding:18px 20px 0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .head h1{margin:0;font-size:44px;font-weight:800;letter-spacing:-.04em}
  .extbadge{font-size:11px;font-family:monospace;color:var(--accent-tx);border:1px solid rgba(240,80,60,.5);border-radius:999px;padding:3px 10px;background:rgba(240,80,60,.08)}
  .body{flex:1;display:flex;gap:14px;padding:14px 20px;min-height:0}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer}
  .btn:hover{border-color:rgba(240,80,60,.5)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
  .btn.pri:hover{background:var(--accent-hi)}.btn.xs{padding:4px 9px;font-size:11.5px;border-radius:8px}
  .side{width:320px;flex-shrink:0;border:1px solid var(--line);border-radius:12px;background:var(--shell);display:flex;flex-direction:column;overflow:hidden}
  .side header{padding:11px 13px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
  .switchrow{display:flex;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line);font-size:13px;font-weight:700}
  .sw{margin-left:auto;width:46px;height:26px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.08);cursor:pointer;position:relative}
  .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:left .15s,background .15s}
  .sw.on{border-color:var(--accent);background:rgba(240,80,60,.25)}
  .sw.on::after{left:22px;background:var(--accent)}
  .rule{padding:9px 12px;border-bottom:1px solid rgba(255,255,255,.05);font-size:12.5px}
  .rule .rt{font-family:monospace;font-weight:700}
  .chip{display:inline-block;font-size:10.5px;border:1px solid rgba(240,80,60,.5);color:var(--accent-tx);border-radius:99px;padding:1px 8px;margin:2px 3px 0 0}
  .board{flex:1;display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;align-content:start;overflow:auto}
  .card{border:1px solid var(--line);border-radius:12px;background:var(--shell);padding:14px}
  .card.low{border-color:rgba(251,191,36,.5)}.card.zero{border-color:rgba(240,80,60,.5)}
  .card h3{margin:0;font-size:15px}.card .n{font-size:30px;font-weight:800;letter-spacing:-.03em}
  .bar{height:6px;border-radius:99px;background:rgba(255,255,255,.08);margin:8px 0;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--ok)}
  input[type=text]{background:#00000066;border:1px solid var(--line);color:var(--tx);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12.5px}
  input:focus{outline:none;border-color:rgba(240,80,60,.6)}
  .player{border-top:1px solid var(--line);background:rgba(16,16,20,.9);padding:9px 20px;display:flex;gap:12px;align-items:center;font-size:12.5px;color:var(--mut)}
  .pbtn{width:38px;height:38px;border-radius:50%;background:var(--accent);border:0;color:#fff;font-size:15px;cursor:pointer;box-shadow:0 0 18px rgba(240,80,60,.45)}
</style>
</head>
<body>
<div class="glow"></div>
<div class="app">
  <nav class="rail"><button title="Library" class="on">▦</button><button title="Favorites">★</button><button title="Shelf">⧉</button><button title="Tools">⚒</button><button title="Organize">▤</button><button title="Settings">⚙</button></nav>
  <div class="main">
    <div class="search"><span style="color:var(--dim)">⌕</span><input id="q" placeholder="Search sounds by name, tag, or format..."><button class="btn xs">⌘K</button></div>
    <div class="head"><h1>Library</h1><span class="extbadge">EXT v2 PROTOTYPE · auto-tag · throwaway</span><span style="flex:1"></span><button class="btn" id="simScan">Simulate new scan (4 files)</button></div>
    <div class="body">
      <aside class="side">
        <header>auto-tag</header>
        <div class="switchrow">Auto-tag new files<button class="sw on" id="sw" aria-label="toggle auto-tag"></button></div>
        <div style="padding:8px 12px;font-size:11px;color:var(--mut)" id="status">On. New files get tagged on arrival.</div>
        <div id="rules" style="flex:1;overflow:auto"></div>
        <div style="padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:6px"><input type="text" id="ntok" placeholder="word, e.g. horse" style="flex:1"><input type="text" id="ntag" placeholder="tags" style="flex:1"><button class="btn pri xs" id="addR">Add</button></div>
      </aside>
      <div class="board" id="board"></div>
    </div>
    <div class="player"><button class="pbtn">▶</button><span id="nowp">Turn auto-tag off and new files land untagged. Turn it on and the board moves.</span><span style="flex:1"></span><span id="libcount"></span></div>
  </div>
</div>
<script>
let files=[
 ["thunder-close_take01.wav",["thunder","weather"]],["thunder-close_take02.wav",[]],
 ["gravel-scrape_close_01.wav",["gravel"]],["wooden-door_creak_long.wav",[]],
 ["rain-gutter_drip_metal.wav",["rain","weather"]],["leather-jacket_rustle_03.wav",[]],
 ["glass-clink_bar_02.wav",[]],["forest-night_crickets_bed.wav",["night","ambience"]],
 ["car-door_slam_interior.wav",[]],["whoosh_large_01.wav",[]],["whoosh_small_02.wav",[]]];
let rules=[
 {tok:"whoosh",tags:["whoosh","movement"]},
 {tok:"thunder",tags:["thunder","weather"]},
 {tok:"rain",tags:["rain","weather"]},
 {tok:"crowd",tags:["crowd"]}];
let autoOn=true, goal=5;
const $=id=>document.getElementById(id);
const hits=(fn,tok)=>fn.toLowerCase().includes(tok.toLowerCase());
function tagFile(f){rules.forEach(r=>{if(hits(f[0],r.tok))r.tags.forEach(t=>{if(!f[1].includes(t))f[1].push(t)})})}
function render(){
  $("rules").innerHTML=rules.map(r=>`<div class="rule"><span class="rt">${r.tok}</span> → ${r.tags.map(t=>`<span class="chip">${t}</span>`).join("")}</div>`).join("");
  const tagged=files.filter(f=>f[1].length).length, pct=Math.round(tagged/files.length*100);
  let html=`<div class="card" style="border-color:rgba(240,80,60,.5)"><h3>Library tagged</h3><div class="n">${pct}<span style="font-size:13px;color:var(--mut)">%</span></div><div class="bar"><i style="width:${pct}%;background:var(--accent-tx)"></i></div><div style="font-size:11.5px;color:var(--mut)">${tagged}/${files.length} files carry tags</div></div>`;
  rules.forEach(r=>{
    const n=files.filter(f=>f[1].includes(r.tags[0])).length;
    const cls=n===0?"zero":n<3?"low":"";
    html+=`<div class="card ${cls}"><h3>#${r.tags[0]}</h3><div class="n">${n}<span style="font-size:13px;color:var(--mut)"> / ${goal}</span></div><div class="bar"><i style="width:${Math.min(100,n/goal*100)}%;${cls?"background:var(--accent)":""}"></i></div><div style="font-size:11.5px;color:var(--mut)">${n===0?"uncovered":n<3?"thin":"covered"}</div><div style="margin-top:6px"><button class="btn xs" onclick="document.getElementById('q').value='${r.tok}'">View files</button></div></div>`;
  });
  $("board").innerHTML=html;
  $("libcount").textContent=files.length+" files indexed";
}
$("sw").onclick=function(){autoOn=!autoOn;this.classList.toggle("on",autoOn);
  $("status").textContent=autoOn?"On. New files get tagged on arrival.":"Off. New files land untagged until you switch back on.";
  $("nowp").textContent=autoOn?"Auto-tag on.":"Auto-tag off. The board will not move on the next scan."};
$("addR").onclick=()=>{const k=$("ntok").value.trim().toLowerCase(),v=$("ntag").value.split(",").map(s=>s.trim().toLowerCase()).filter(Boolean);
  if(!k||!v.length)return;rules.push({tok:k,tags:v});$("ntok").value="";$("ntag").value="";render();
  $("nowp").textContent=`Rule added: ${k}. It applies to new arrivals from here on.`};
const NEWBATCH=[["crowd-cheer_stadium_bed.wav"],["thunder-distant_roll_01.wav"],["horse-trot_gravel_01.wav"],["paper-bag_crumple_fast.wav"]];
let batch=0;
$("simScan").onclick=()=>{
  if(batch>=1){$("nowp").textContent="No more demo files. Add a rule and scan again in the real app.";return}
  batch++;
  NEWBATCH.forEach(n=>files.push([n[0],[]]));
  if(autoOn){files.slice(-4).forEach(tagFile);
    $("nowp").textContent="4 files indexed. Auto-tag was on, so it tagged what it recognised. The board moved.";}
  else{$("nowp").textContent="4 files indexed untagged, because auto-tag is off. Flip it on and scan again.";}
  render();
};
render();
</script>
</body>
</html>
